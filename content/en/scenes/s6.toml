# reverence at home; then the two worlds fold outward into scorched-iron and
# golden altar wings while the holy icon rises out of a column of light; then
# everything dissolves into velvet dark, leaving one eternal blinking prompt.
# Every {placeholder} is a glossary term from content/en/terms*.toml.
# ==========================================================================

